# HSYNC configuration
#
# Loaded by the systemd service via EnvironmentFile=/etc/hsync/hsync.conf.
# Values follow the .env convention; quoted strings are recommended.
#
# The service runs in LAN peer-to-peer mode with continuous watch by default
# (see /usr/lib/systemd/system/hsync.service). Every variable below is read
# either by hsync itself (HSYNC_ prefixed settings) or substituted into the
# unit's ExecStart (HSYNC_BUCKET, HSYNC_PATH). To switch to server mode,
# override the unit: ``systemctl edit hsync.service``.

# Bucket name (alphanumeric, hyphens and underscores).
HSYNC_BUCKET="hsync"

# Local path to synchronize.
HSYNC_PATH="/var/lib/hsync"

# ── LAN mode ───────────────────────────────────────────────────────────────
# Use HTTPS for LAN peer communication (recommended).
HSYNC_LAN_HTTPS="true"

# Stay active indefinitely waiting for peers.
HSYNC_LAN_PERSISTENT="true"

# Restrict discovery to peers sharing this group name (empty = no filter).
HSYNC_LAN_GROUP=""

# Shared secret for peer authentication (requires HSYNC_LAN_HTTPS=true).
HSYNC_LAN_KEY=""

# Seconds to wait for the first peer (0 = wait indefinitely).
HSYNC_DISCOVERY_TIMEOUT="10"

# Never become master; always remain a client/slave.
HSYNC_NEVER_MASTER="false"

# ── Server mode (used only if ExecStart is switched to server mode) ─────────
HSYNC_SERVER=""
HSYNC_API_KEY=""

# ── Sync behaviour ─────────────────────────────────────────────────────────
# Do not propagate file deletions (backup mode).
HSYNC_IGNORE_DELETE="false"

# Enable zstd compression for file transfers.
HSYNC_COMPRESSION_ENABLED="true"
