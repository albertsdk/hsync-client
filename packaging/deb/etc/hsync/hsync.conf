# HSYNC configuration
#
# Loaded by the systemd service via EnvironmentFile=/etc/hsync/hsync.conf.
# Values follow the .env convention; quoted strings are recommended.
#
# The service runs in p2p peer-to-peer mode with continuous/daemon mode by
# default (the client default: it retries an unreachable peer forever)
# (see /usr/lib/systemd/system/hsync.service). Every variable below is read
# either by hsync itself (HSYNC_ prefixed settings) or substituted into the
# unit's ExecStart (HSYNC_BUCKET, HSYNC_PATH). To switch to server mode,
# override the unit: ``systemctl edit hsync.service``.

# Bucket name (alphanumeric, hyphens and underscores).
HSYNC_BUCKET="hsync"

# Local path to synchronize.
#
# Default: /var/lib/hsync  (works out of the box with the systemd service).
#
# If you change this to a path under /home (e.g. /home/alice/Documents),
# you must also update the service's ReadWritePaths directive:
#
#   sudo systemctl edit hsync.service
#
# and add the following (replace the path with your own):
#
#   [Service]
#   ReadWritePaths=/home/alice/Documents
#
# The service uses ProtectHome=read-only, so it can read files under /home
# but can only write to paths explicitly listed in ReadWritePaths.
HSYNC_PATH="/var/lib/hsync"

# ── p2p mode ───────────────────────────────────────────────────────────────
# Use HTTPS for p2p peer communication (recommended).
HSYNC_P2P_HTTPS="true"

# Restrict discovery to peers sharing this group name (empty = no filter).
HSYNC_P2P_GROUP=""

# Shared secret for peer authentication (requires HSYNC_P2P_HTTPS=true).
# Two forms, set only one:
#   HSYNC_P2P_PASSPHRASE  user password, at least 12 characters (derived to the key)
#   HSYNC_P2P_KEY         full raw group key, at least 32 characters (used as-is)
# REQUIRED when running as a systemd service: the unit runs non-interactively
# with bidirectional sync, so the client aborts with [AUTH REQUIRED] if both are
# empty. A keyless read-only service must instead set the acknowledgement below.
HSYNC_P2P_PASSPHRASE=""
HSYNC_P2P_KEY=""

# Explicit acknowledgement for keyless P2P (no shared key above). Peers are not
# authenticated and reads are open to the network. Only set "true" for a trusted
# network after understanding the exposure.
HSYNC_P2P_ALLOW_UNAUTHENTICATED="false"

# Directory holding the persistent device identity (device ID + p2p keypair)
# plus the per-folder sync-state databases (syncstate/<uuid>.db, syncstate/index.db).
# The _hsync system user has no home directory, so this must point to a
# writable location listed in the unit's ReadWritePaths.
HSYNC_DEVICE_DIR="/var/lib/hsync/device"

# Installation state directory. The client only shows the resolved value in
# its verbose startup log; its sync state lives under HSYNC_DEVICE_DIR above.
# HSYNC_STATE_DIR is the server's per-bucket state dir, kept here for parity
# with the documented layout. Must be listed in the unit's ReadWritePaths.
HSYNC_STATE_DIR="/var/lib/hsync/state"

# Directory holding the per-directory instance locks (one <sha256>.lock file
# per synced directory). The _hsync system user has no $XDG_RUNTIME_DIR, so
# the default ($XDG_RUNTIME_DIR/hsync/locks) is not usable: locks would
# otherwise fall back to <device-dir>/locks. Listed in ReadWritePaths.
HSYNC_LOCKS_DIR="/var/lib/hsync/locks"

# File storing the pinned fingerprints of known p2p peers (TOFU).
# The _hsync system user has HOME=/nonexistent, so the default
# ($XDG_STATE_HOME/hsync/p2p_known_peers.json) is not usable.
# This path must be under a directory listed in the unit's ReadWritePaths.
HSYNC_P2P_PIN_FILE="/var/lib/hsync/p2p_known_peers.json"

# File storing the trusted discovery-server fingerprints (known-hosts store).
# Same HOME=/nonexistent caveat as above: the default
# ($XDG_STATE_HOME/hsync/discovery_server_known_hosts.json) is not usable here.
HSYNC_DISCOVERY_SERVER_TRUST_FILE="/var/lib/hsync/discovery_server_known_hosts.json"

# File storing the trusted sync-server fingerprints (known-hosts store).
# Same HOME=/nonexistent caveat as above.
HSYNC_SERVER_TRUST_FILE="/var/lib/hsync/server_known_hosts.json"

# Seconds to wait for the first peer (0 = wait indefinitely).
HSYNC_PEER_DISCOVERY_TIMEOUT="0"

# Never become master; always remain a client/slave.
HSYNC_NEVER_MASTER="false"

# ── Server mode (used only if ExecStart is switched to server mode) ─────────
HSYNC_SERVER_URL=""
HSYNC_API_KEY=""

# ── Sync behaviour ─────────────────────────────────────────────────────────
# Do not propagate file deletions (backup mode).
HSYNC_IGNORE_DELETE="false"

# Enable zstd compression for file transfers.
HSYNC_COMPRESSION_ENABLED="true"
