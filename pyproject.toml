[tool.poetry]
name = "hsync-client"
version = "1.0.0"
description = "HSYNC Client"
authors = ["Alberto Basso"]
license = "MPL-2.0"
readme = "README.md"
packages = [{include = "hsync_client"}]

[tool.poetry.scripts]
hsync = "hsync_client.main:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
hsync-common = {path = "../hsync-common", develop = true}
urllib3 = "^2.7.0"
websockets = "^16.0"
watchdog = "^6.0.0"
requests = "^2.32.3"
python-dotenv = "^1.2.1"
zeroconf = "^0.148.0"
cryptography = ">=43.0.3,<44.0.0"
pydantic-settings = "^2.12.0"
loguru = "^0.7.3"
typer = "^0.21.1"
tenacity = "^9.1.3"
zstandard = "^0.25.0"

[tool.poetry.group.build.dependencies]
pyinstaller = "^6.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
ruff = "^0.9.0"
mypy = "^1.14.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B904", "SIM115", "SIM117", "SIM102", "SIM105"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
