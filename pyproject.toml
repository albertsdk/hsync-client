[project]
name = "hsync-client"
version = "1.2.0-alpha.1"
description = "HSYNC Client"
authors = [{name = "Alberto Basso", email = "17047798+albertsdk@users.noreply.github.com"}]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aioquic>=1.3.0,<2.0.0",
    "cryptography>=50.0.2,<51.0.0",
    "hsync-common==1.2.0-alpha.1",
    "ifaddr>=0.2,<0.3",
    "loguru>=0.7.3,<0.9.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "requests>=2.34.2,<3.0.0",
    "tenacity>=9.1.4,<10.0.0",
    "typer>=0.29.0,<0.30.0",
    "urllib3>=2.8.0,<3.0.0",
    "watchdog>=7.1.0,<8.0.0",
    "websockets>=17.1,<18.0",
    "zeroconf>=0.154.0,<0.155.0",
    "zstandard>=0.25.0,<0.26.0",
    "aiohttp>=3.12.0,<4.0.0",
]

[project.scripts]
hsync = "hsync_client.main:main"

[tool.poetry]
packages = [{include = "hsync_client"}]

[tool.poetry.dependencies]
hsync-common = {path = "../hsync-common", develop = true}

[tool.poetry.group.build.dependencies]
pyinstaller = "^6.22.3"

[tool.poetry.group.dev.dependencies]
pytest-rerunfailures = ">=16.7"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.0.0"
ruff = "0.17.5"
mypy = "^2.3.1"
pre-commit = "^4.6.2"

# hsync-server is only required by the opt-in black-box test suite
# (test_bb_*, gated behind HSYNC_BB_SERVER=1 / HSYNC_BB_P2P=1), which spins up
# the real server as a loopback subprocess. It is an optional sibling repo that
# is not present in CI (where test_bb_* is excluded), so it lives in an optional
# group: `poetry install` skips it; install it with `poetry install --with blackbox`.
[tool.poetry.group.blackbox]
optional = true

[tool.poetry.group.blackbox.dependencies]
hsync-server = {path = "../hsync-server", develop = true}

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "flaky: test with environmental timing sensitivity (retried via pytest-rerunfailures)",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["../hsync-common", "../hsync-server"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error::DeprecationWarning:hsync_client.*",
    "error::DeprecationWarning:tests.*",
    "default::Warning:hsync_client.*",
    "default::Warning:tests.*",
    "ignore::urllib3.exceptions.InsecureRequestWarning",
    "ignore::DeprecationWarning:pathspec.*",
    "ignore::DeprecationWarning:watchdog.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Curated best-practice set shared across the hsync Python projects (see
# hsync-common/pyproject.toml for the rationale). ``ignore`` keeps the
# opinionated/noisy rules out; ``per-file-ignores`` relaxes the tests.
select = [
    "E", "F", "W",       # pycodestyle, pyflakes, warnings
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B", "A", "C4",      # bugbear, builtin shadowing, comprehensions
    "ISC", "ICN",        # implicit string concat, import conventions
    "PIE", "RET", "RSE", # misc lints, return, raise
    "SIM", "TID",        # simplify, tidy-imports
    "ARG", "PERF",       # unused arguments, performance
    "FURB", "RUF",       # refurb, ruff-specific (noqa / __all__ hygiene)
    "PGH", "LOG", "G",   # pygrep-hooks, logging
    "PL", "T10", "ERA",  # pylint, debugger, commented-out code
    "C90",               # mccabe complexity (threshold below)
]
ignore = [
    # pre-existing
    "E501", "E402", "B904", "SIM115", "SIM117", "SIM102", "SIM105",
    # deliberate patterns / opinionated rules
    "ARG002",                     # unused method args: interface/override conformance
    "EM101", "EM102", "TRY003",   # exception-message style (opinionated)
    "N818",                       # exception naming: public API already shipped
    "PLC0415",                    # import-outside-top-level: lazy imports are deliberate
    "PLW0603",                    # global-statement: module singletons are deliberate
    "PLR2004",                    # magic values: domain thresholds, noise > signal
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917",  # function-shape metrics
    "PTH",                        # pathlib migration deliberately out of scope here
    "DTZ005",                     # datetime.now without tz (single, audited site)
    "ERA001",                     # commented-out code: false positives on doc examples
    "RUF002", "RUF003",           # ambiguous unicode: intentional math notation
    "G004",                       # logging f-strings: the client's deliberate style
    "N802", "N806", "N811", "N813",  # http.server do_* / Qt overrides / import naming
    "PLW0108",                    # "unnecessary" lambdas kept for late binding
    "A002",                       # a shadowing parameter name kept for the public API
    "RUF001",                     # ambiguous unicode: deliberate typography in strings
    "ARG001",                     # unused args kept for handler/callback signatures
    "ISC004",                     # deliberate multi-line concatenation inside a list
    "A001",                       # domain names like ``dir`` shadow a builtin
]

[tool.ruff.lint.per-file-ignores]
# A test keeps otherwise-unused fixture parameters/lambdas, unpacked shapes, odd
# strings and loose expression style; a bench may too.
"tests/**" = [
    "ARG002", "ARG004", "ARG005", "RUF012", "RUF059", "RUF007", "RUF015",
    "RUF005", "RUF010", "PLR0402", "PLW1510", "PLW2901", "RET501", "RET504",
    "PLR1711", "PIE807", "PIE808", "FURB171", "ICN001", "RSE102", "PERF401",
]
"bench/**" = ["ARG002", "ARG005", "RUF059", "PLR0402", "PLW1510", "PIE807", "RUF007"]
# The utils ``__all__`` is grouped by submodule, not alphabetical.
"hsync_client/utils/__init__.py" = ["RUF022"]
# Auxiliary trees (published docs examples, pentest probes) are illustrative.
"docs/**" = ["N803", "PLR1714", "RUF046"]
"pentest/**" = ["PERF401"]

[tool.ruff.lint.mccabe]
# A pragmatic ceiling that the current code meets; lower it as functions are
# refactored (see the `# noqa: C901` debt markers on the worst offenders).
max-complexity = 25

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
