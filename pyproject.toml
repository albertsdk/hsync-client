[project]
name = "hsync-client"
version = "1.0.0"
description = "HSYNC Client"
authors = [{name = "Alberto Basso", email = "17047798+albertobasso@users.noreply.github.com"}]
license = "MPL-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cryptography>=48.0.1,<51.0.0",
    "hsync-common==1.0.0",
    "loguru>=0.7.3,<0.8.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "requests>=2.32.3,<3.0.0",
    "tenacity>=9.1.3,<10.0.0",
    "typer>=0.26.0,<0.28.0",
    "urllib3>=2.7.0,<3.0.0",
    "watchdog>=6.0.0,<7.0.0",
    "websockets>=16.0,<17.0",
    "zeroconf>=0.149.0,<0.151.0",
    "zstandard>=0.25.0,<0.26.0",
]

[project.scripts]
hsync = "hsync_client.main:main"

[tool.poetry]
packages = [{include = "hsync_client"}]

[tool.poetry.dependencies]
hsync-common = {path = "../hsync-common", develop = true}

[tool.poetry.group.build.dependencies]
pyinstaller = "^6.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
ruff = "^0.15.0"
mypy = "^2.1.0"
pre-commit = "^4.0.1"

# hsync-server is only required by the opt-in black-box test suite
# (test_bb_*, gated behind HSYNC_BB_SERVER=1 / HSYNC_BB_LAN=1), which spins up
# the real server as a loopback subprocess. It is an optional sibling repo that
# is not present in CI (where test_bb_* is excluded), so it lives in an optional
# group: `poetry install` skips it; install it with `poetry install --with blackbox`.
[tool.poetry.group.blackbox]
optional = true

[tool.poetry.group.blackbox.dependencies]
hsync-server = {path = "../hsync-server", develop = true}

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["../hsync-common", "../hsync-server"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error::DeprecationWarning:hsync_client.*",
    "error::DeprecationWarning:tests.*",
    "default::Warning:hsync_client.*",
    "default::Warning:tests.*",
    "ignore::urllib3.exceptions.InsecureRequestWarning",
    "ignore::DeprecationWarning:pathspec.*",
    "ignore::DeprecationWarning:watchdog.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B904", "SIM115", "SIM117", "SIM102", "SIM105"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
