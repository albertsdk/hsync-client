[tool.poetry]
name = "hsync-client"
version = "0.1.0"
description = "HSYNC Client"
authors = ["Alberto Basso <alberto.sdk@gmail.com>"]
readme = "README.md"
packages = [{include = "hsync_client"}]

[tool.poetry.scripts]
hsync = "hsync_client.main:main"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pyinstaller = "^6.12.0"
websockets = "^16.0"
watchdog = "^6.0.0"
requests = "^2.32.3"
python-dotenv = "^1.2.1"
zeroconf = "^0.148.0"
cryptography = "^46.0.4"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
