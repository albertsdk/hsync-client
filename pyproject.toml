[project]
name = "hsync-client"
version = "1.0.0"
description = "HSYNC Client"
authors = [{name = "Alberto Basso", email = "17047798+albertsdk@users.noreply.github.com"}]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aioquic>=1.3.0,<2.0.0",
    "cryptography>=50.0.1,<51.0.0",
    "hsync-common==1.0.0",
    "loguru>=0.7.3,<0.8.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "requests>=2.34.2,<3.0.0",
    "tenacity>=9.1.4,<10.0.0",
    "typer>=0.27.2,<0.28.0",
    "urllib3>=2.8.0,<3.0.0",
    "watchdog>=6.0.0,<7.0.0",
    "websockets>=17.1,<18.0",
    "zeroconf>=0.151.3,<0.152.0",
    "zstandard>=0.25.0,<0.26.0",
    "aiohttp>=3.12.0,<4.0.0",
]

[project.scripts]
hsync = "hsync_client.main:main"

[tool.poetry]
packages = [{include = "hsync_client"}]

[tool.poetry.dependencies]
hsync-common = {path = "../hsync-common", develop = true}

[tool.poetry.group.build.dependencies]
pyinstaller = "^6.22.3"

[tool.poetry.group.dev.dependencies]
pytest-rerunfailures = ">=16.7"
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.0.0"
ruff = "0.16.10"
mypy = "^2.3.1"
pre-commit = "^4.6.2"

# hsync-server is only required by the opt-in black-box test suite
# (test_bb_*, gated behind HSYNC_BB_SERVER=1 / HSYNC_BB_P2P=1), which spins up
# the real server as a loopback subprocess. It is an optional sibling repo that
# is not present in CI (where test_bb_* is excluded), so it lives in an optional
# group: `poetry install` skips it; install it with `poetry install --with blackbox`.
[tool.poetry.group.blackbox]
optional = true

[tool.poetry.group.blackbox.dependencies]
hsync-server = {path = "../hsync-server", develop = true}

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "flaky: test with environmental timing sensitivity (retried via pytest-rerunfailures)",
]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["../hsync-common", "../hsync-server"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "error::DeprecationWarning:hsync_client.*",
    "error::DeprecationWarning:tests.*",
    "default::Warning:hsync_client.*",
    "default::Warning:tests.*",
    "ignore::urllib3.exceptions.InsecureRequestWarning",
    "ignore::DeprecationWarning:pathspec.*",
    "ignore::DeprecationWarning:watchdog.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E402", "B904", "SIM115", "SIM117", "SIM102", "SIM105"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
