name: Release

# Publish prebuilt client binaries, .deb packages and WD OS5 .bin installers as
# GitHub Release assets. Two triggers:
#
# 1. vX.Y.Z tag pushed  →  create a formal Release (bumped version).
# 2. workflow_dispatch  →  build artifacts without a tag (useful for testing;
#                          optionally create a draft Release).
#
# PyInstaller cannot cross-compile, so native binaries are built on per-OS
# matrix runners; the Linux-only packages are built via Docker + qemu.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release (otherwise just build artifacts)"
        type: boolean
        default: false
      version_suffix:
        description: "Optional version suffix (e.g. 'dev', 'test123')"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { path: hsync-client }
      - uses: actions/checkout@v5
        with:
          repository: albertobasso/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pipx install poetry
      - name: Lint and test
        working-directory: hsync-client
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run pytest -q

  build-binaries:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-amd64,   archive: tar }
          - { os: ubuntu-24.04-arm, target: linux-arm64,   archive: tar }
          - { os: macos-latest,     target: darwin-arm64,  archive: tar }
          - { os: macos-15-intel,  target: darwin-amd64,  archive: tar }
          - { os: windows-latest,   target: windows-amd64, archive: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with: { path: hsync-client }
      - uses: actions/checkout@v5
        with:
          repository: albertobasso/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pipx install poetry
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            BASE=$(grep -E '^version\s*=' hsync-client/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            SUFFIX="${{ inputs.version_suffix }}"
            if [ -n "$SUFFIX" ]; then
              echo "version=${BASE}-${SUFFIX}" >> "$GITHUB_OUTPUT"
            else
              echo "version=${BASE}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Build native binary
        working-directory: hsync-client
        run: |
          poetry config virtualenvs.in-project true
          poetry install --with build --no-interaction
          ./compile.sh
      - name: Package binary
        working-directory: hsync-client
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p release-out
          cd "dist/${{ matrix.target }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../../release-out/hsync-client-${version}-${{ matrix.target }}.zip" hsync.exe
          else
            tar czf "../../release-out/hsync-client-${version}-${{ matrix.target }}.tar.gz" hsync
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: hsync-client/release-out/*

  build-packages:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { path: hsync-client }
      - uses: actions/checkout@v5
        with:
          repository: albertobasso/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}
      # The .deb/WD OS5 images are cross-built for ARMv7/arm64 under qemu-user.
      # The QEMU that ships with the ubuntu-latest runner has regressed and makes
      # gcc crash deterministically with SIGSEGV (exit 139) while emitting -O3
      # code for some CPython/OpenSSL translation units (e.g. Python/_warnings.c),
      # aborting the source builds even at -j1. Register a pinned, known-good
      # QEMU/binfmt build instead of relying on the runner default. A recent
      # QEMU (v10.x) is required: older lines (e.g. v7.0.0) avoid the gcc
      # SIGSEGV but regress the emulated link step, making CPython's libm probe
      # (AC_CHECK_FUNCS acosh/asinh/... -lm) fail with "requires C99 compatible
      # libm" during ./configure.
      - name: Set up QEMU (pinned, known-good)
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v10.1.3
          platforms: arm,arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build .deb and WD OS5 packages
        working-directory: hsync-client
        run: |
          ./compile.sh --target deb-all
          ./compile.sh --target wd-os5-all
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            hsync-client/dist/deb/*.deb
            hsync-client/dist/wd-os5/*.bin

  release:
    needs: [build-binaries, build-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { path: hsync-client }
      - name: Determine release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            BASE=$(grep -E '^version\s*=' hsync-client/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            SUFFIX="${{ inputs.version_suffix }}"
            if [ -n "$SUFFIX" ]; then
              echo "tag=v${BASE}-${SUFFIX}" >> "$GITHUB_OUTPUT"
            else
              echo "tag=v${BASE}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Flatten assets
        run: |
          cd assets
          # download-artifact preserves the artifact's internal directory
          # structure, so the packages artifact lands under deb/ and wd-os5/.
          # Move every file to the top level for flat release assets.
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
      - name: Prepare installer
        run: |
          sed "s/^readonly DEFAULT_VERSION=.*/readonly DEFAULT_VERSION=\"${{ steps.tag.outputs.tag }}\"/" \
            hsync-client/install.sh > "assets/install.sh"
          chmod 755 "assets/install.sh"
      - name: Generate checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || inputs.create_release
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          generate_release_notes: true
