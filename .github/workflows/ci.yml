# CI — hsync-client
# Lint + tests for the CLI / LAN P2P client. hsync-client depends on the shared
# library through a Poetry path dependency (../hsync-common), so the sibling repo
# is checked out alongside it. The pytest run includes the LAN/pairing behaviour
# tests that consume the shared golden fixtures.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout hsync-client
        uses: actions/checkout@v7
        with:
          path: hsync-client

      # Path dependency: ../hsync-common must sit next to this repo.
      # hsync-common is a private repo, so the default GITHUB_TOKEN cannot read
      # it; authenticate with a PAT stored in the HSYNC_COMMON_PAT secret.
      - name: Checkout hsync-common
        uses: actions/checkout@v7
        with:
          repository: albertobasso/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Gate the markdown docs on valid relative links, including the cross-repo
      # ADR pointers into the sibling hsync-common checkout. Pure stdlib script.
      - name: Docs link-check
        working-directory: hsync-client
        run: python ../hsync-common/scripts/dev/check_doc_links.py .

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        working-directory: hsync-client
        # Skip the optional `blackbox` group: it pulls in the sibling
        # hsync-server repo (not checked out here) and is only needed by the
        # opt-in test_bb_* suite, which is excluded below.
        run: poetry install --no-interaction --without blackbox

      - name: Ruff (lint)
        working-directory: hsync-client
        run: poetry run ruff check .

      - name: Ruff (format check)
        working-directory: hsync-client
        run: poetry run ruff format --check .

      - name: Tests
        working-directory: hsync-client
        run: poetry run pytest -q --ignore-glob='*test_bb*'
