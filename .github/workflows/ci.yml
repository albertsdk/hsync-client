# CI — hsync-client
# Lint + tests for the CLI / p2p client. hsync-client depends on the shared
# library through a Poetry path dependency (../hsync-common), so the sibling repo
# is checked out alongside it. The pytest run includes the LAN/pairing behaviour
# tests that consume the shared golden fixtures.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout hsync-client
        uses: actions/checkout@v7.0.1
        with:
          path: hsync-client

      # Path dependency: ../hsync-common must sit next to this repo.
      # hsync-common is a private repo, so the default GITHUB_TOKEN cannot read
      # it; authenticate with a PAT stored in the HSYNC_COMMON_PAT secret.
      - name: Checkout hsync-common
        uses: actions/checkout@v7.0.1
        with:
          repository: albertsdk/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Gate the markdown docs on valid relative links, including the cross-repo
      # ADR pointers into the sibling hsync-common checkout. Pure stdlib script.
      - name: Docs link-check
        working-directory: hsync-client
        run: python ../hsync-common/scripts/dev/check_doc_links.py .

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install dependencies
        working-directory: hsync-client
        # Skip the optional `blackbox` group: it pulls in the sibling
        # hsync-server repo (not checked out here) and is only needed by the
        # opt-in test_bb_* suite, which is excluded below.
        run: poetry install --no-interaction --without blackbox

      - name: Ruff (lint)
        working-directory: hsync-client
        run: poetry run ruff check .

      - name: Ruff (format check)
        working-directory: hsync-client
        run: poetry run ruff format --check .

      - name: Tests
        working-directory: hsync-client
        run: poetry run pytest -q --ignore-glob='*test_bb*'

  # Cross-platform signal (the `python` job above is Linux-only).
  # NOTE: both jobs check out `hsync-common` at `main`, so this change only goes
  # green once the paired hsync-common commit is pushed/merged — land common
  # first. macOS keeps POSIX modes and symlinks, so it runs the full unit suite; the
  # Windows runner runs the platform-parity subset, because the wider suite has
  # POSIX-mode assertions and symlink creation (Developer Mode) that need a
  # dedicated Windows sweep before they can be blocking. The BB suite stays on
  # Linux (env-gated).
  platforms:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pytest-args: "--ignore-glob='*test_bb*'"
          - os: windows-latest
            pytest-args: >-
              tests/test_utils_paths.py tests/test_utils_fs_ops.py
              tests/test_cross_platform_sync.py tests/test_capabilities.py
              tests/test_startup_imports.py
    steps:
      - name: Checkout hsync-client
        uses: actions/checkout@v7.0.1
        with:
          path: hsync-client

      - name: Checkout hsync-common
        uses: actions/checkout@v7.0.1
        with:
          repository: albertsdk/hsync-common
          ref: main
          path: hsync-common
          token: ${{ secrets.HSYNC_COMMON_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install dependencies
        working-directory: hsync-client
        run: poetry install --no-interaction --without blackbox

      - name: Tests
        working-directory: hsync-client
        shell: bash
        run: poetry run pytest -q ${{ matrix.pytest-args }}
